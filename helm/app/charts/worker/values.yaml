deployment:
  replicas: 1
  image:
    name: mikolgi/foodgram-backend
    tag: v3
    imagePullPolicy: IfNotPresent
  command:
    - celery
    - -A
    - foodgram
    - worker
    - --concurrency=2
    - -E
    - -Q
    - holidays,weather
    - -l
    - info
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  env:
    values: {}
    config: {}
    secret: {}
    fromSecrets: []
