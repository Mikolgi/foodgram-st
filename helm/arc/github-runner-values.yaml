githubConfigUrl: https://github.com/Mikolgi/foodgram-st

runnerScaleSetName: foodgram-arc-runner

minRunners: 0
maxRunners: 2

containerMode:
  type: dind

listenerTemplate:
  spec:
    containers:
      - name: listener
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi

template:
  spec:
    serviceAccountName: arc-runner-deployer
