name: Release And Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  RELEASE_SUFFIX: github
  BACKEND_IMAGE_NAME: ${{ vars.BACKEND_IMAGE_NAME || 'mikolgi/foodgram-backend' }}
  FRONTEND_IMAGE_NAME: ${{ vars.FRONTEND_IMAGE_NAME || 'mikolgi/foodgram-frontend' }}

jobs:
  verify:
    name: Verify project
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_DB: foodgram
          POSTGRES_USER: foodgram
          POSTGRES_PASSWORD: foodgram
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foodgram -d foodgram"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_NAME: foodgram
      DB_USER: foodgram
      DB_PASSWORD: foodgram
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Lint backend
        run: flake8 backend/foodgram

      - name: Run backend checks
        working-directory: backend/foodgram
        run: |
          python manage.py migrate --noinput
          python manage.py check
          python manage.py test

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Build frontend
        working-directory: frontend
        env:
          CI: false
        run: npm run build

  release:
    name: Publish semantic release
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      release_version: ${{ steps.semantic.outputs.new_release_version }}
      release_git_tag: ${{ steps.semantic.outputs.new_release_git_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run semantic-release
        id: semantic
        uses: cycjimmy/semantic-release-action@v5
        with:
          extra_plugins: |
            @semantic-release/commit-analyzer
            @semantic-release/release-notes-generator
            @semantic-release/changelog
            @semantic-release/git
            @semantic-release/github
        env:
          GITHUB_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

  build-images:
    name: Build and push Docker images
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE_NAME }}:${{ needs.release.outputs.release_git_tag }}-${{ env.RELEASE_SUFFIX }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE_NAME }}:${{ needs.release.outputs.release_git_tag }}-${{ env.RELEASE_SUFFIX }}

  deploy:
    name: Deploy to Kubernetes
    needs:
      - release
      - build-images
    if: needs.release.outputs.new_release_published == 'true' && vars.CI_RUNNER_LABEL != ''
    runs-on: ${{ vars.CI_RUNNER_LABEL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure in-cluster kubeconfig
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${KUBERNETES_SERVICE_HOST:-}" ]; then
            mkdir -p "$HOME/.kube"
            kubectl config set-cluster in-cluster \
              --server="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT_HTTPS}" \
              --certificate-authority=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
              --embed-certs=true
            kubectl config set-credentials arc-runner \
              --token="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
            kubectl config set-context in-cluster \
              --cluster=in-cluster \
              --user=arc-runner \
              --namespace="$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)"
            kubectl config use-context in-cluster
          fi
          kubectl cluster-info

      - name: Install vals
        shell: bash
        run: |
          set -euo pipefail
          version="0.42.4"
          arch="$(uname -m)"
          case "$arch" in
            x86_64) arch="amd64" ;;
            aarch64|arm64) arch="arm64" ;;
            *)
              echo "Unsupported architecture: $arch"
              exit 1
              ;;
          esac

          bin_dir="$RUNNER_TEMP/bin"
          mkdir -p "$bin_dir"
          curl -fsSL -o "$RUNNER_TEMP/vals.tar.gz" "https://github.com/helmfile/vals/releases/download/v${version}/vals_${version}_linux_${arch}.tar.gz"
          tar -xzf "$RUNNER_TEMP/vals.tar.gz" -C "$bin_dir" vals
          echo "$bin_dir" >> "$GITHUB_PATH"

      - name: Deploy release with Helm
        shell: bash
        env:
          BACKEND_IMAGE_TAG: ${{ needs.release.outputs.release_git_tag }}-${{ env.RELEASE_SUFFIX }}
          FRONTEND_IMAGE_TAG: ${{ needs.release.outputs.release_git_tag }}-${{ env.RELEASE_SUFFIX }}
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
        run: bash ./helm/deploy-ci.sh
